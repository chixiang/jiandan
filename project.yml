name: JianDan
options:
  bundleIdPrefix: com.jiandan
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  groupSortPosition: top
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  JianDan:
    type: application
    platform: iOS
    sources:
      - path: JianDan
    info:
      path: JianDan/Info.plist
      properties:
        CFBundleDisplayName: 减单
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSPhotoLibraryUsageDescription: 减单需要访问相册以添加告别物品的照片
        NSPhotoLibraryAddUsageDescription: 减单需要保存照片到相册
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.jiandan.app
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  JianDanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JianDanTests
    dependencies:
      - target: JianDan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiandan.app.tests
  JianDanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: JianDanUITests
    dependencies:
      - target: JianDan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiandan.app.uitests